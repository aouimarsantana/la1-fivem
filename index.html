<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La 1 - Directo</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background: black;
            overflow: hidden;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: black;
        }

        #mensaje {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            background: black;
            font-family: Arial, sans-serif;
            font-size: 20px;
            z-index: 10;
        }

        #sonido {
            position: fixed;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            padding: 20px 35px;
            background: white;
            color: black;
            border: none;
            border-radius: 10px;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            z-index: 20;
        }

        #sonido:hover {
            transform: translate(-50%, -50%) scale(1.05);
        }
    </style>
</head>

<body>

    <div id="mensaje">Cargando La 1...</div>

    <video
        id="video"
        controls
        autoplay
        playsinline>
    </video>

    <button id="sonido" style="display:none;">
        🔊 ACTIVAR SONIDO
    </button>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <script>
        const video = document.getElementById("video");
        const mensaje = document.getElementById("mensaje");
        const botonSonido = document.getElementById("sonido");

        const stream =
            "https://rtvelivestream.rtve.es/rtvesec/la1/la1_main_dvr.m3u8";

        function ocultarMensaje() {
            mensaje.style.display = "none";
        }

        function mostrarBotonSonido() {
            botonSonido.style.display = "block";
        }

        function reproducir() {
            video.muted = false;

            video.play().then(() => {
                botonSonido.style.display = "none";
            }).catch(() => {
                mostrarBotonSonido();
            });
        }

        botonSonido.addEventListener("click", () => {
            video.muted = false;

            video.play().then(() => {
                botonSonido.style.display = "none";
            });
        });

        if (video.canPlayType("application/vnd.apple.mpegurl")) {

            video.src = stream;

            video.addEventListener("loadedmetadata", () => {
                ocultarMensaje();
                reproducir();
            });

        } else if (Hls.isSupported()) {

            const hls = new Hls();

            hls.loadSource(stream);
            hls.attachMedia(video);

            hls.on(Hls.Events.MANIFEST_PARSED, () => {
                ocultarMensaje();
                reproducir();
            });

            hls.on(Hls.Events.ERROR, function(event, data) {

                console.log("Error HLS:", data);

                if (data.fatal) {
                    mensaje.innerText =
                        "No se puede reproducir La 1.";
                }
            });

        } else {

            mensaje.innerText =
                "Este navegador no es compatible con HLS.";
        }
    </script>

</body>
</html>
